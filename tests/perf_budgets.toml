# t370.15 round 3 (user decision 2026-09-27, 案(a) — this round): implemented
# 案(a). `doc_update_section` now rehashes only the *edited* section via
# `lexsim::content_hash` and reuses every other section's already-known hash
# from the pre-edit read (`storage::docs::split::compute_sections_after_splice`);
# the whole-document `content_hash` is composed from the section hashes via a
# cheap FNV-1a fold (`storage::docs::split::compose_doc_hash`) instead of a
# second, independent `lexsim::content_hash(whole_body)` pass over the entire
# ~39.9KB body. `read_doc_hashed`'s own hashed-read path picked up the same
# fix (one tokenize pass instead of two), so the *read* half of this op got
# cheaper too. Re-measured JA p50 (median of 3 runs: 53.4 / 88.1 / 55.7ms —
# see this task's dev report for the full before/after table): **55.7ms**,
# comfortably under the 100ms budget and no longer dependent on the written
# document's size at all (the per-language JA tokenize cost is now paid once,
# for one section, not the whole body twice) — so the
# `size_threshold_bytes`/`size_extra_ms_per_mib` mechanism this budget used to
# carry is removed as no longer needed (it never actually fired for any
# current S/M/L/JA fixture, and the root cause it was trying to work around no
# longer exists). `expected_fail` removed (promoted) — PR-4 is met at every
# scale (S/M/L/JA).

# M1 t360.6 (wiki/220-vmodel-integration-design.md §2.4, wiki/240 §5-3): a
# metadata-only `doc_save` on the fixture's small, scale-independent layer
# document (`FixtureMeta::layer_doc_slug`, fixed item count at every S/M/L/JA
# scale). After the one-time warm-up sync, `source.body_raw_hash` matches on
# every timed rep (body unchanged), so `sync_layer_items_if_needed` skips the
# parse+rebuild pass entirely — this should cost about the same as any other
# metadata-only PR-4 op (`doc_verify_set_dev_stage` et al.), not scale with
# the JA fixture's large main document. Measured p50 (1 warm-up + 7 reps):
# S 3.6ms, M 3.8ms, L 5.0ms, JA 8.6ms — comfortably under the 100ms budget
# and, as designed, roughly flat across scales (dominated by the fixed
# `LAYER_ITEM_COUNT`, not by S/M/L/JA's task/doc/subitem counts).
#
# Rework round 2 (MAJOR fix, wiki/220 §2.4 step 7): a layer `doc_save`/
# `doc_update_section` that actually re-syncs the matrix now also loads a
# fresh `DocSet` once and refreshes `_requirements_summary.json` (see
# `refresh_after_layer_sync`, `src/mcp/handlers/docs.rs`) — but this op's
# timed reps never trigger that (`layer`/`split_level` unchanged, body
# byte-identical, so the short-circuit above still skips the sync entirely,
# same as before this fix). Re-measured p50 after the fix: S 3.2ms, M 3.6ms,
# L 3.2ms, JA 8.0ms — unchanged within noise, confirming the fix added no
# cost to the skipped path.
#
# M2-04 (wiki/260-vmodel-m2-design.md E7): the short-circuit above now also
# compares `source.layer_sync_stamp` (a hash of the sync-affecting config
# subset) in addition to `body_raw_hash`, which means `read_config` +
# `LayerRegistry::build` + `compute_layer_sync_stamp` now run unconditionally
# on *every* call to this op, not only when a resync is about to happen —
# unlike `parse_layer_body`'s O(document size) cost, these are O(project
# config size) (a handful of `[[trace.layer]]`/`[trace.profiles.*]` entries),
# so this was expected to stay cheap. Re-measured p50 (S/M, release build,
# this task's dev report): both still comfortably under the 100ms budget, no
# `expected_fail` needed.
[[budget]]
op = "doc_save_layer_metadata"
ms = 100

# The worst case for the same document: every rep changes the body, so
# `sync_layer_items` always reparses+rebuilds `LAYER_ITEM_COUNT` items. Fixed
# item count regardless of scale (see `FixtureMeta::layer_doc_slug`'s doc
# comment) is deliberate: this op's cost should be dominated by its own small,
# constant body, not by the unrelated S/M/L/JA scale knobs — so, unlike the
# plain `doc_update_section` op above, this is not expected to need a JA
# `expected_fail`. Measured p50 (pre rework round 2): S 5.8ms, M 5.9ms,
# L 8.1ms, JA 27.0ms — all comfortably under the 100ms budget with no
# `expected_fail` needed at any scale, confirming `body_raw_hash`'s FNV-1a
# raw-byte hash (not `lexsim::content_hash`) keeps layer-sync's own re-parse
# cost independent of the *other* fixture documents' size/language.
#
# Rework round 2 (MAJOR fix): unlike `doc_save_layer_metadata` above, this op
# *does* trigger a real sync on every timed rep (byte-different body each
# time), so it now also pays `refresh_after_layer_sync`'s `DocSet::load` +
# `write_requirements_summary` pass over the whole corpus on every rep — the
# cost this task's done_criteria explicitly requires (wiki/220 §2.4 step 7),
# not a regression to work around. Re-measured p50 after the fix: S 8.6ms,
# M 16.5ms, L 20.3ms, JA 33.1ms — all still comfortably under the 100ms
# budget (worst case JA at ~33% of budget), scaling with the fixture's
# doc/subitem count as expected for a full-corpus summary aggregation, not
# with the fixed `LAYER_ITEM_COUNT` alone.
[[budget]]
op = "doc_update_section_layer"
ms = 100

# PR-8: I/O budget for the requirement-linked status change — read volume
# must stay within (target doc bytes + target task bytes) + 256 KiB. This
# entry carries no `ms`; perf_budget.rs reads only its `expected_fail` (and
# `optional`, since it's checked against `IoCounters.rchar` directly in
# run_budget_suite, not against a measured op in `results`).
#
# t370.11: before this task, `expected_fail` here had no
# `expected_fail_scales`, and `run_budget_suite`'s `io_*` checks read
# `entry.expected_fail` directly instead of going through
# `LatencyBudget::expected_fail_at` — so this single blanket reason applied
# at *every* scale, hiding the fact that t370.4 had regressed rchar at
# M/L/JA specifically (S already met budget). `perf_budget.rs`'s
# `classify_io_check` now scale-gates `io_*` checks the same way the `ms`
# checks above always have. `write_requirements_summary`'s new in-process
# write cache (t370.11: `(len, mtime_ns)`-keyed, avoids re-reading the
# existing ~0.7-1MB summary file to compare on repeat same-process calls)
# fixed rchar at S/M/L: measured post-fix S ~122KB, M ~113KB, L ~115KB — all
# comfortably within the ~277KB envelope (back at the pre-t370.4 M-S3
# baseline of ~115KB at L). JA still exceeded its budget as of t370.11
# (~489KB against the ~361KB single-document budget of that time).
#
# t370.12 rework (MAJOR, integration feedback round 1): root-caused as a
# `tests/perf_budget.rs`/`tests/support/perf_fixture.rs` budget-formula/
# fixture-linkage mismatch, not a production regression — `io_budget_bytes`
# only ever budgeted for one document (`meta.doc_slug`) and one task
# (`meta.hot_req_task`), but `propagate_dev_stage_for_task`
# (`src/mcp/handlers/docs.rs`) legitimately touches more than that on every
# call: (1) `hot_req_task`'s requirement links deliberately span two docs
# (`FixtureMeta::hot_req_task`'s doc comment — docs 0/1), so both get
# read/written, and (2) its min-of-linked-tasks dev_stage computation reads
# every *co-linked* task's own status file too
# (`FixtureMeta::hot_colinked_tasks`), not just `hot_req_task`'s. Fixed
# `io_budget_bytes` to sum bytes for every doc in `hot_req_doc_slugs` and
# every task in `[hot_req_task] + hot_colinked_tasks` instead of hardcoding
# one of each (see `tests/perf_budget.rs`'s `io_budget_bytes_tests` module
# for the regression tests pinning this down). Re-measured JA (3 repeat
# full-process runs): rchar 489KB against the now-correct ~496KB budget in
# all 3 runs — within budget. `expected_fail` removed (promoted) — PR-8
# rchar is met at all scales (S ~122KB/312KB, M ~113KB/309KB, L
# ~115KB/310KB, JA ~489KB/496KB).
[[budget]]
op = "io_update_task_status_with_links"
ms = 0
optional = true

# PR-8 write-side counterpart: "内容が変わらないファイルは書かない". Same
# (doc + task) bytes + 256 KiB envelope applied to `wchar`. What used to
# dominate wchar at M/L was never the linked documents' bodies (those are
# ~20KB each at S/M/L — the budget itself is doc + task + 256KiB = ~277KB)
# but the derived `_requirements_summary.json` (~0.7MB at M/L's 2,500
# SubItems, ~0.14MB at S's 500): every rep flips a linked SubItem's
# dev_stage, so the aggregate genuinely changes and the whole summary is
# rewritten (P-M4's skip-if-unchanged cannot apply to a value that did
# change) — see t370.11's now-removed `expected_fail` note in git history
# for the measured ~177KB(S)/~717KB(M)/~753KB(L)/~862KB(JA) figures.
#
# t370.14 (decision 2026-09-27 案(a), wiki/240-performance-design.md §6
# PR-8): root-caused as a budget-formula mismatch, not a production gap — a
# derived file's size scales with the *whole* requirements corpus, not with
# the single doc/task a per-item envelope is about, so it was never the
# right thing to charge against this budget in the first place. `wchar` is
# now measured with the derived-file rewrite excluded
# (`tests/perf_budget.rs`'s `measure_wchar_split`, which also asserts the
# derived file is written at most once per request), and the derived
# rewrite itself is checked separately against its own discipline — "unchanged
# content is never rewritten, at most 1 write per request" — in
# `tests/derived_summary_write_discipline.rs`, not a byte budget here.
# Re-measured post-split at every scale: non-derived wchar tracks the (doc +
# task) envelope like rchar does, comfortably inside budget. `expected_fail`
# removed (promoted) — PR-8 wchar (as redefined by this task) is met at all
# scales.
[[budget]]
op = "io_wchar_update_task_status_with_links"
ms = 0
optional = true

