# Performance budgets for tests/perf_budget.rs (NFR-008/NFR-009,
# wiki/240-performance-design.md §6-7).
#
# Every `ms` budget is scaled by `HANDOFF_PERF_SLACK` (env var, default 1.0;
# shared CI runners set 3.0) before comparison, so a slower/busier machine
# doesn't spuriously fail the gate. The `io_*` (PR-8) and `[[ratio_budget]]`
# (PR-9) entries are NOT scaled by slack: wiki/240-performance-design.md §6
# states they are machine-independent (byte counts and timing ratios), so
# shared CI runners must be held to the exact same bound as a dev machine.
#
# `expected_fail = "reason"` marks a budget the current code is known not to
# meet yet (recorded in the printed table as `expected-fail`, non-fatal).
# When the referenced follow-up task lands and the op meets budget, the
# table prints `PROMOTE?` — remove the `expected_fail` key at that point so
# the budget becomes enforced again.
#
# `expected_fail_scales = ["L"]` restricts `expected_fail` to the named
# scale(s) (S/M/L/JA); at every other scale the budget stays enforced. Use it
# for ops that only overrun at the large nightly scales, so the Tier 1 S/M
# gate keeps catching regressions in them.
#
# `optional = true` marks a budget whose `op` is not guaranteed to appear in
# every `run_ops()` result map (e.g. it depends on a fixture-provided free
# stable_id, or it's an `io_*` pseudo-entry checked against `IoCounters`
# directly rather than a measured latency). Any other budget whose `op` is
# missing from the results is a hard failure in tests/perf_budget.rs, so a
# typo/rename here or in `run_ops` cannot silently disable a gate.

[[budget]]
op = "list_tasks"
ms = 50

[[budget]]
op = "load_context"
ms = 50
# t370.11 round 2: `load_context` (`src/mcp/handlers/load_context.rs`) does
# not call `write_requirements_summary`/`compute_derived_inputs`/
# `stat_tasks_input` at all — it only builds `build_task_index_with_expiry`
# (`src/storage/tasks.rs`), which reads every task's *full* JSON body (not
# just `stat`, unlike `stat_tasks_input`). At L scale (3,000 tasks, ~3.7MB
# rchar) that full-body read is the dominant cost and sits right at this
# op's 50ms budget: measured p50 across 5 repeat full-process runs was
# 64.9/49.4/50.6/53.6/49.3ms (median 50.6ms), 3 of 5 over budget. This is a
# separate, pre-existing cost center from t370.4/t370.11's regression (which
# was specifically `write_requirements_summary`'s full-file re-read, now
# fixed — see `update_task_status_with_links`/
# `update_task_requirement_ids_toggle` below, both comfortably back under
# their 25ms internal target at L). S (~22.4ms) and M (~38.7ms) still have
# real margin, so this is scoped to L only. Needs its own follow-up (e.g.
# parallelizing `build_task_index`'s per-task-file reads the way
# `stat_tasks_input` now parallelizes its stat walk, or a persistent task
# summary cache) — out of t370.11's scope, which targeted the
# derived-requirements-summary write path, not the task index read path.
expected_fail = "load_context builds build_task_index_with_expiry (storage::tasks.rs), which reads every task's full JSON body — a separate cost center from t370.4/t370.11's write_requirements_summary regression (already fixed). At L scale (3,000 tasks) this full-body read alone sits at the 50ms budget (median 50.6ms across 5 runs, 3/5 over); S/M have real margin. Needs its own follow-up (parallel task-body reads or a persistent index cache), out of t370.11's scope."
expected_fail_scales = ["L"]

[[budget]]
op = "get_metrics"
ms = 50

[[budget]]
op = "dashboard"
ms = 100

[[budget]]
op = "doc_list"
ms = 150

[[budget]]
op = "doc_req_list"
ms = 150

[[budget]]
op = "doc_req_status"
ms = 150

# t370.8 (wiki/240-performance-design.md §4 P-M1): "coldstart" ops measure a
# brand-new process's very first `doc_list`/`doc_req_status` call at JA scale
# (`perf_budget_cold_start_ja`, not part of the warm-process `run_ops`
# suite above) — the scenario a per-process P-M1 cache (t370.2) cannot help
# with at all (short-lived CLI invocation, or an MCP server's first request
# right after startup). PR-5's 150ms target is used as the budget here too.
# Measured (3 repeat runs, JA scale, no cache warm-up at all): cold_doc_list
# p50 ~28-30ms, cold_doc_req_status p50 ~51-55ms — both comfortably under
# the 150ms budget precisely *because* read_doc/read_all_docs no longer pay
# the lexsim::content_hash cost on this first, necessarily-uncached read.
[[budget]]
op = "cold_doc_list"
ms = 150
# Measured only by the dedicated `perf_budget_cold_start_ja` test, never by
# `run_ops`/`run_budget_suite` (which always discards a warm-up rep first —
# the opposite of what "cold start" means here) — `optional` so the S/M/L/JA
# suites above don't hard-fail over this op being absent from their results.
optional = true

[[budget]]
op = "cold_doc_req_status"
ms = 150
optional = true

# PR-5 also names the hook path explicitly (wiki §6): `doc_query`
# (UserPromptSubmit / PreToolUse) is the largest real-world cost measured in
# wiki §2 (800ms real project, 2,160ms JA). t370.2 (read-path process cache,
# C1) fixed the read_all_docs cost this op pays, closing the gap at S scale
# (20 docs), but `doc_query` also runs a BM25 relevance pass over every
# section's text on every call (not part of C1/read-path caching) — that
# cost grows with doc count and is markedly more expensive for Japanese text
# (lexsim tokenization), so M/L (100 docs) and JA still miss PR-5.
[[budget]]
op = "doc_query"
ms = 150
expected_fail = "BM25 relevance scoring cost (not read-path parsing, which t370.2 already fixed) scales with doc count and Japanese tokenization cost — still needs a scoring-side fix to meet PR-5 at M/L/JA"
expected_fail_scales = ["M", "L", "JA"]

[[budget]]
op = "update_task_status_no_links"
ms = 10

[[budget]]
op = "update_task_status_with_links"
ms = 50
# t370.4 regressed this at S/M/L (`write_requirements_summary`'s new
# "skip the write if unchanged" check `fs::read` the existing ~0.7-1MB
# `_requirements_summary.json` on every call to compare, and
# `compute_derived_inputs` stat'd every `_task.*.json` under `tasks/`
# sequentially): L p50 rose from t370.3's ~17ms to ~42.4-49.8ms (still
# barely inside the 50ms budget, but rchar rose 115KB -> 829KB, well over
# PR-8's ~277KB envelope — see the `io_update_task_status_with_links` entry
# below). t370.11 fixed both: an in-process cache of the last
# summary content this process wrote (keyed by `(len, mtime_ns)`, mirrors
# `storage::docs`'s `DocCacheStamp`) removes the repeat full-file read/parse
# for same-process calls, and `stat_tasks_input` parallelizes its per-
# top-level-subtree stat walk across worker threads once there are enough
# subtrees to be worth it. Re-measured post-t370.11 round 1: S ~11.8ms, M
# ~21.5ms, L ~26.4-29.7ms (median of 3 repeat runs ~27.1ms) — an internal
# ≤25ms target (reviewer MAJOR, round 1 rework feedback) was still ~2ms
# over. Round 2: the same in-process cache now holds the *native*
# `PersistedRequirementsSummary` struct instead of a `serde_json::Value` —
# the stat-matching hot path compares it via `PartialEq` directly, with no
# `serde_json::to_value` tree construction and no second `to_string` pass on
# the (rare) write path either. Re-measured post-round-2: L p50 across 3
# repeat full-process runs: 25.1ms/22.5ms/23.1ms, median 23.1ms — under the
# 25ms internal target with margin, and comfortably under this op's own
# 50ms budget at every scale except JA,
# which still exceeds it (~123.8ms) for an unrelated reason: propagate's own
# write-time hash of the JA fixture's ~1.25MB document plus the unavoidable
# full-body re-read (t370.8 already removed the read-time re-hash CPU cost,
# cutting JA from ~212-328ms to ~130ms) — needs a follow-up that avoids
# re-reading/re-hashing the whole body for a metadata-only SubItem change,
# out of t370.11's scope (which targeted the derived-summary write path,
# not per-document body hashing).
expected_fail = "propagate's write-time hash + the unavoidable full-body re-read of the JA fixture's ~1.25MB document still exceed PR-1's 50ms budget at JA scale — needs a follow-up that avoids re-reading/re-hashing the whole body for a metadata-only SubItem change"
expected_fail_scales = ["JA"]

[[budget]]
op = "update_task_requirement_ids_toggle"
ms = 100
# Same t370.3 fix as `update_task_status_with_links` above met PR-3 at
# S/M/L (p50 ~8-16ms); JA missed it (p50 ~108-170ms across earlier
# measurements) because the write-invalidated large JA document had to be
# fully re-parsed *and* re-hashed (`lexsim::content_hash` over the whole
# ~1.25MB body plus every section) on this op's own subsequent `DocSet::load`.
# t370.8 (deferred content_hash — `read_all_docs`/`DocSet::load` no longer
# compute a hash this op never looks at) removed that CPU cost: JA now
# measures p50 ~74-79ms (3 repeat runs), comfortably under the 100ms budget.
# Promoted (expected_fail removed) — PR-3 is met at all scales.
# t370.11 round 2: this op also calls `write_requirements_summary`, so it
# benefits from the same native-struct-comparison fix as
# `update_task_status_with_links` above. Re-measured at L (3 repeat
# full-process runs): 20.8ms/20.1ms/21.5ms, median 20.8ms — comfortably
# under the reviewer's ≤25ms internal target (round 1 was 24.1ms dev /
# 25.7ms tester, borderline).
# Needs a free stable_id the fixture may not always produce for arbitrary
# FixtureOpts (see FixtureMeta::extra_stable_id); every scale preset in
# tests/support/perf_fixture.rs currently does produce one, but this stays
# `optional` so a future preset without one doesn't hard-fail the suite.
optional = true

[[budget]]
op = "doc_verify_set_dev_stage"
ms = 100
# t370.3's DocSet-based `propagate_dev_stage_for_task` (not directly on this
# action's path, but the same JA-body-rehash cost applies to any write that
# touches the JA fixture's one large document) met PR-4 at S/M/L (p50
# ~10-48ms). t370.8 (deferred content_hash) cut JA from p50 ~110-180ms down
# to ~125ms by removing the read-time re-hash CPU cost, but this action still
# writes the JA fixture's large document (dev_stage change), which must be
# hashed at write time by design (wiki/240 §4 P-M1) plus the plain body
# re-read cost (I/O, unaffected by hash laziness) — still over the 100ms
# budget at JA scale.
expected_fail = "t370.8 cut this from ~110-180ms to ~125ms at JA scale by removing the read-time re-hash CPU cost, but the write-time hash of the JA fixture's large document plus its full-body re-read still exceed PR-4's 100ms budget — needs the same follow-up as update_task_status_with_links"
expected_fail_scales = ["JA"]

[[budget]]
op = "doc_verify_set_dev_stage_by_id"
ms = 100
# t370.3's id->slug index (P-M2, replacing find_doc_by_id's full-corpus scan)
# met PR-4 at S/M/L (p50 ~6-46ms). t370.8 cut JA from p50 ~110-153ms to
# ~123ms (same read-time re-hash CPU removal as the other ops in this
# group), but the same write-time hash + full-body re-read cost as
# `doc_verify_set_dev_stage` keeps it over the 100ms budget.
expected_fail = "t370.8 cut this from ~110-153ms to ~123ms at JA scale, but the write-time hash of the JA fixture's large document plus its full-body re-read still exceed PR-4's 100ms budget (id-resolution path, C2) — needs the same follow-up as update_task_status_with_links"
expected_fail_scales = ["JA"]

[[budget]]
op = "doc_verify_link_task"
ms = 100
# Met PR-4 at S/M/L (p50 ~8-49ms) once t370.3 landed. t370.8 cut JA from p50
# ~112-156ms to ~126ms, but the same write-time hash + full-body re-read
# cost as the other doc_verify ops in this group keeps it over the 100ms
# budget.
expected_fail = "t370.8 cut this from ~112-156ms to ~126ms at JA scale, but the write-time hash of the JA fixture's large document plus its full-body re-read still exceed PR-4's 100ms budget — needs the same follow-up as update_task_status_with_links"
expected_fail_scales = ["JA"]

[[budget]]
op = "doc_update_section"
ms = 100
# t370.3's manager follow-up (handle_doc_update_section reusing resolve_doc's
# already-computed `doc.sections` instead of redundantly re-running
# split()+compute_sections(), plus collapsing the write into one
# `write_doc_with_body` atomic write instead of `write_doc_body` + `write_doc`
# re-reading and rewriting the same file) cut JA p50 further (measured
# ~189.7ms here, down from t370.2's ~260-500ms) but still does not close it:
# the freshly-written ~1.25MB JA body must still be hashed at write time (by
# design, per wiki/240 §4 P-M1 — write-time self-compute is not cached).
# Needs (per wiki/220 §5.3) a cheap raw-byte hash for large write-time
# bodies, or deferring the hash entirely (t370.8) — out of this task's scope.
expected_fail = "t370.3 cut this to ~190ms at JA scale (down from ~260-500ms) by removing the redundant split()+compute_sections() recompute and collapsing the write to one atomic write; t370.8 (deferred content_hash on read) does not further help this specific op, since it already only hashes its own freshly-written body once (no read-time re-hash to remove) — the freshly-written ~1.25MB JA body must still be hashed at write time by design (wiki/240 §4 P-M1). Measured ~187.5ms at JA scale post-t370.8, consistent with the ~189.7ms pre-t370.8 baseline. Needs (per wiki/220 §5.3) a cheap raw-byte hash for large write-time bodies instead of lexsim tokenization — out of t370.8's scope (t370.8 only deferred the *read*-time hash)."
expected_fail_scales = ["JA"]

# PR-8: I/O budget for the requirement-linked status change — read volume
# must stay within (target doc bytes + target task bytes) + 256 KiB. This
# entry carries no `ms`; perf_budget.rs reads only its `expected_fail` (and
# `optional`, since it's checked against `IoCounters.rchar` directly in
# run_budget_suite, not against a measured op in `results`).
#
# t370.11: before this task, `expected_fail` here had no
# `expected_fail_scales`, and `run_budget_suite`'s `io_*` checks read
# `entry.expected_fail` directly instead of going through
# `LatencyBudget::expected_fail_at` — so this single blanket reason applied
# at *every* scale, hiding the fact that t370.4 had regressed rchar at
# M/L/JA specifically (S already met budget). `perf_budget.rs`'s
# `classify_io_check` now scale-gates `io_*` checks the same way the `ms`
# checks above always have. `write_requirements_summary`'s new in-process
# write cache (t370.11: `(len, mtime_ns)`-keyed, avoids re-reading the
# existing ~0.7-1MB summary file to compare on repeat same-process calls)
# fixed rchar at S/M/L: measured post-fix S ~122KB, M ~113KB, L ~115KB — all
# comfortably within the ~277KB envelope (back at the pre-t370.4 M-S3
# baseline of ~115KB at L). JA still exceeds its ~361KB budget (~489KB):
# unrelated to the write-cache fix — the JA fixture's own ~1.25MB linked
# document must still be fully read to apply the SubItem mutation, which is
# a separate cost (see `update_task_status_with_links`'s `ms` entry above).
[[budget]]
op = "io_update_task_status_with_links"
ms = 0
expected_fail = "the JA fixture's ~1.25MB linked document must still be fully read to apply the SubItem mutation — unrelated to t370.11's write-cache fix, which already brought S/M/L within budget (~113-122KB vs ~277KB)"
expected_fail_scales = ["JA"]
optional = true

# PR-8 write-side counterpart: "内容が変わらないファイルは書かない". Same
# (doc + task) bytes + 256 KiB envelope applied to `wchar`. Unlike the rchar
# entry above, t370.11 did not change this one's status. What dominates
# wchar at M/L is NOT the linked documents' bodies (those are ~20KB each at
# S/M/L — the budget itself is doc + task + 256KiB = ~277KB) but the derived
# `_requirements_summary.json` (~0.7MB at M/L's 2,500 SubItems, ~0.14MB at
# S's 500): every rep flips a linked SubItem's dev_stage, so the aggregate
# genuinely changes and the whole summary is rewritten (P-M4's skip-if-
# unchanged cannot apply). The arithmetic confirms it: wchar tracks the
# SubItem corpus size (S ~177KB -> M ~717KB -> L ~753KB, M and L share the
# same 2,500 SubItems), not the per-document size (constant at S/M/L), and
# pre-t370.11 L rchar minus post-fix rchar (829KB - 115KB = ~714KB) is the
# same summary file being read back. `expected_fail_scales` is added here
# (previously absent, so the reason applied blanket-fashion the same way the
# rchar entry above did) purely to stop hiding a future regression at the one
# scale (S) that already meets budget — it does not reflect a t370.11 fix.
# Measured: S ~177KB (within the ~277KB envelope), M ~717KB, L ~753-754KB,
# JA ~862KB (all over their ~277-361KB envelopes). Needs a genuinely new fix
# on the derived-summary write side (e.g. shard or incrementally update the
# summary so a single dev_stage flip does not rewrite ~0.7MB) — out of
# t370.11's scope.
[[budget]]
op = "io_wchar_update_task_status_with_links"
ms = 0
expected_fail = "wchar is dominated by rewriting the whole derived _requirements_summary.json (~0.7MB at M/L) whenever a linked SubItem's dev_stage changes, which it does on every rep — S meets budget (~177KB) but M/L/JA still exceed it (~717-862KB vs ~277-361KB budget); needs a sharded/incremental summary write, not addressed by t370.11"
expected_fail_scales = ["M", "L", "JA"]
optional = true

# PR-9 scale-ratio guards (nightly only — see tests/perf_budget.rs
# perf_budget_scale_ratio_n/_d).
[[ratio_budget]]
name = "scale_ratio_n"
max_ratio = 1.5

[[ratio_budget]]
name = "scale_ratio_d"
max_ratio = 1.5
# t370.3 (single DocSet load) met PR-9's D ratio: measured ratio 0.83 (well
# under the 1.5 budget) scaling docs 20 -> 100 with subitems held at 500.
