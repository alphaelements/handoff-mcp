[advisories]
ignore = [
    # serde_yaml depends on unsafe-libyaml which is unmaintained.
    # serde_yaml itself is deprecated; migration to saphyr is tracked
    # but not yet done. No security vulnerability — just unmaintained.
    "RUSTSEC-2024-0449",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
