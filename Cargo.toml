[package]
name = "handoff-mcp"
version = "0.36.0"
edition = "2021"
description = "MCP server that gives AI coding agents persistent memory across sessions"
license = "MIT"
repository = "https://github.com/alphaelements/handoff-mcp"
homepage = "https://github.com/alphaelements/handoff-mcp"
readme = "README.md"
keywords = ["mcp", "ai", "claude", "handoff", "context"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"
exclude = ["lefthook.yml", "tmp/", "wiki/", ".claude/", ".vscode/"]

# Tuned for the prebuilt binaries published to npm. strip = "debuginfo" (not
# "symbols") on purpose: users of the npm package cannot rebuild with symbols,
# so RUST_BACKTRACE must keep resolving function names for bug reports.
# "symbols" would degrade backtraces to bare addresses.
# opt-level = "z" and panic = "abort" are deliberately not set — this is a
# long-running server and unwinding behavior is not something to change here.
[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
lexsim = { version = "0.8", features = ["semantic"] }
pulldown-cmark = "0.13"
serde_yaml = "0.9"
fs2 = "0.4"
# JUnit XML parsing for handoff_trace_ingest (wiki/260-vmodel-m2-design.md
# §4.6/E10, M2-11): entity references/CDATA/namespaces are not worth
# hand-rolling, and no XML parser was previously a dependency.
quick-xml = "0.42"

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
criterion = "0.5"

# Tier 2 perf bench (NFR-009, wiki/240-performance-design.md §7). Manual/
# nightly only — `cargo bench --bench docs_read`, not part of `cargo test`.
[[bench]]
name = "docs_read"
harness = false

