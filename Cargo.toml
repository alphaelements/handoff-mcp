[package]
name = "handoff-mcp"
version = "0.46.0"
edition = "2021"
description = "MCP server that gives AI coding agents persistent memory across sessions"
license = "MIT"
repository = "https://github.com/alphaelements/handoff-mcp"
homepage = "https://github.com/alphaelements/handoff-mcp"
readme = "README.md"
keywords = ["mcp", "ai", "claude", "handoff", "context"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"
exclude = ["lefthook.yml", "tmp/", "wiki/", ".claude/", ".vscode/"]

# Tuned for the prebuilt binaries published to npm. strip = "debuginfo" (not
# "symbols") on purpose: users of the npm package cannot rebuild with symbols,
# so RUST_BACKTRACE must keep resolving function names for bug reports.
# "symbols" would degrade backtraces to bare addresses.
# opt-level = "z" and panic = "abort" are deliberately not set — this is a
# long-running server and unwinding behavior is not something to change here.
[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1

# Bundles the Typst compiler (wiki/390-typst-library-bundling.md, REQ-PDF-040).
# Off by default so everyday builds do not compile the Typst dependency tree;
# release builds pass `--features bundled-typst`. Without it, PDF export falls
# back to an external `typst` CLI.
[features]
default = []
bundled-typst = [
    "dep:typst-as-lib",
    "dep:typst",
    "dep:typst-layout",
    "dep:typst-pdf",
]

# `bundled-typst` runs the whole Typst compiler in-process. Unoptimized it takes
# seconds per page (the PDF e2e tests then exceed the compile timeout), so its
# crates are optimized even in dev/test builds. Cargo only builds these when the
# feature is on; the rest of the dev profile is unchanged.
[profile.dev.package.typst]
opt-level = 2
[profile.dev.package.typst-eval]
opt-level = 2
[profile.dev.package.typst-layout]
opt-level = 2
[profile.dev.package.typst-library]
opt-level = 2
[profile.dev.package.typst-pdf]
opt-level = 2
[profile.dev.package.typst-realize]
opt-level = 2
[profile.dev.package.typst-syntax]
opt-level = 2
[profile.dev.package.typst-utils]
opt-level = 2
[profile.dev.package.typst-kit]
opt-level = 2
[profile.dev.package.krilla]
opt-level = 2
[profile.dev.package.subsetter]
opt-level = 2
[profile.dev.package.comemo]
opt-level = 2
[profile.dev.package.rustybuzz]
opt-level = 2
[profile.dev.package.ttf-parser]
opt-level = 2
[profile.dev.package.fontdb]
opt-level = 2
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.flate2]
opt-level = 2

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
lexsim = { version = "0.8", features = ["semantic"] }
pulldown-cmark = "0.13"
serde_yaml = "0.9"
fs2 = "0.4"
# JUnit XML parsing for handoff_trace_ingest (wiki/260-vmodel-m2-design.md
# §4.6/E10, M2-11): entity references/CDATA/namespaces are not worth
# hand-rolling, and no XML parser was previously a dependency.
quick-xml = "0.42"
# NFKC normalization for `def_hash`/`ac_hash` (wiki/260-vmodel-m2-design.md
# §2.4, M2-02): promoted from a transitive dependency (via lexsim) to a
# direct one because lexsim's own `normalize` also lowercases and could
# change behavior across lexsim versions independently of this crate —
# `def_hash`/`ac_hash` need a normalization whose behavior this crate pins
# itself, not one that rides along with an unrelated dependency bump.
unicode-normalization = "0.1"
handlebars = "6.4.4"
# Embedded Typst compiler (feature `bundled-typst`). The typst-* crates are
# released in lockstep: keep all of them on the same minor version. `typst` and
# `typst-layout` are direct dependencies because the compile call needs the
# `World` trait and the `PagedDocument` type that typst-pdf consumes.
# Fonts: the system's (`typst-kit-fonts`) plus the Latin/math/mono fonts the
# Typst CLI embeds as well (`typst-kit-embed-fonts`, ~10 MB). The embedded set is
# needed: without a math font a passthrough block with an equation fails to
# compile ("no font could be found"). No CJK font is embedded.
typst-as-lib = { version = "0.17", optional = true, features = [
    "typst-kit-fonts",
    "typst-kit-embed-fonts",
] }
typst = { version = "0.15", optional = true }
typst-layout = { version = "0.15", optional = true }
typst-pdf = { version = "0.15", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
criterion = "0.5"

# Tier 2 perf bench (NFR-009, wiki/240-performance-design.md §7). Manual/
# nightly only — `cargo bench --bench docs_read`, not part of `cargo test`.
[[bench]]
name = "docs_read"
harness = false

# Requirement-tree bench (SPEC-TREE-015): trace_report / trace_tree over a
# 3,000-item synthetic corpus. Manual/nightly only —
# `cargo bench --bench trace_tree`.
[[bench]]
name = "trace_tree"
harness = false
