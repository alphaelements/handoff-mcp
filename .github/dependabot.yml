version: 2
updates:
  # Keeps SHA-pinned actions (the "# vX.Y.Z" trailing comment) up to date.
  # Dependabot can only rewrite the pin when that comment is the last thing
  # on the line — do not append anything after it (e.g. no "(pinned)" suffix).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # The typst-* compiler crates are released in lockstep (wiki/390 section 6):
    # one grouped PR keeps them aligned instead of N PRs that each fail
    # scripts/check-typst-versions.sh on their own.
    groups:
      typst:
        patterns:
          - "typst*"
