name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly perf gate (NFR-009, wiki/240-performance-design.md §7): scale
    # L/JA and the PR-9 scale-ratio checks regenerate a 3,000-task fixture
    # and rerun the op suite from scratch, too slow for every push. 03:00
    # UTC is off-peak for both the GitHub-hosted runner pool and this repo's
    # (Japan-based) usual working hours.
    - cron: "0 3 * * *"

permissions:
  contents: read

env:
  # nproc-sized default parallelism can OOM the runner on large crates, and
  # rustc reports the resulting kill as a misleading "can't find crate" /
  # "rlib format" error rather than an OOM. Cap parallelism explicitly.
  CARGO_BUILD_JOBS: 2

jobs:
  # Rust fmt + clippy + test across the OS matrix, plus the declared MSRV.
  #
  # ubuntu-22.04 is pinned explicitly (never ubuntu-latest): ubuntu-latest is
  # 24.04/glibc2.39, which drops the ability to represent Debian 12 / RHEL 9
  # userspace compatibility.
  test:
    # The nightly `schedule` trigger exists solely to run the perf-nightly
    # job below (L/JA scale + PR-9 ratio checks); the regular build/test
    # matrix already runs on every push and pull_request, so skip it here
    # to avoid burning CI minutes on a redundant nightly re-run.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            toolchain: stable
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          # MSRV leg: Cargo.toml declares rust-version = "1.85". Without a CI
          # leg pinned to that version, using a newer-than-MSRV API would
          # compile fine on stable and ship undetected, breaking consumers
          # who build against the declared MSRV. clippy lints churn across
          # Rust releases, so the MSRV leg intentionally skips clippy here
          # and only proves build+test succeed at the floor version; stable
          # legs above already cover clippy.
          - os: ubuntu-22.04
            toolchain: "1.85"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy --no-self-update && rustup default ${{ matrix.toolchain }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Cache correctness must not depend on a hit: the key is scoped to
          # OS + toolchain + Cargo.lock hash, and a miss just rebuilds from
          # scratch (never reads stale artifacts from a different lockfile).
          key: cargo-${{ matrix.os }}-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-${{ matrix.toolchain }}-

      # cargo fmt --check is OS-independent (pure text formatting check), so
      # it only needs to run once; restricted to the Linux/stable leg to
      # avoid redundant work on the other legs.
      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-22.04' && matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      # clippy runs on every OS leg (not just Linux): #[cfg(windows)] and
      # other cfg-gated branches are invisible to a Linux-hosted clippy, so
      # skipping non-Linux legs here would let platform-specific code rot
      # undetected. The MSRV leg is stable-only (see matrix comment above).
      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # Criterion Tier 2 benches (`cargo bench`, wiki/240-performance-design.md
      # §7) are otherwise never exercised by CI (too slow for every push, and
      # not covered by `cargo test` — bench targets aren't built by `cargo
      # test`/`cargo build`, only by `cargo bench` or an explicit `--benches`
      # flag) — that gap is exactly how `benches/docs_read.rs` broke silently
      # (t370.7: `bench_frontmatter_round_trip` kept serializing docs read via
      # the lazy `read_all_docs`, whose `content_hash: None` (since t370.8)
      # made `serialize_frontmatter` panic at runtime; `cargo clippy --all-targets` already type-checks
      # this file on every stable leg, so a *compile-only* gate here would add
      # nothing new). `--test` makes criterion run every `#[bench]` function's
      # body exactly once — a correctness smoke test with no statistical
      # sampling — cheap enough for every push and it reproduces the exact
      # failure class that slipped through before. Linux/stable-only (like
      # `cargo fmt --check` above): the benched logic has no OS-specific
      # branches, so running it on every OS leg would be redundant CI time.
      - name: cargo bench --test (Tier 2 smoke test, no timing)
        if: matrix.os == 'ubuntu-22.04' && matrix.toolchain == 'stable'
        run: cargo bench --bench docs_read -- --test

  # lefthook's JS/plugin-sync gates, mirrored here so a contributor who
  # bypasses local hooks still can't merge an out-of-sync generated file.
  # Linux-only: these gates have no OS-specific behavior.
  sync-gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: workflow-inline-sync
        run: ./scripts/sync-workflow-inline.sh --check

      - name: workflow-js-test
        run: node --test "plugin-task-loop/workflows/lib/*.test.js"

      # npm wrapper + platform-package generation. These guard the invariants
      # that would otherwise only surface as a broken install after publish:
      # the wrapper's resolution table, the build matrix, and the exact-version
      # optionalDependencies pins must all agree.
      - name: npm-distribution-test
        run: node --test "bin/*.test.js"

      - name: plugin-version-sync
        run: ./scripts/sync-plugin-version.sh --check

      - name: plugin-skills-sync
        run: ./scripts/sync-plugin-skills.sh --check

  # Tier 1 perf gate (NFR-008/NFR-009, wiki/240-performance-design.md §7):
  # scales S and M, on every push to main. Not run on pull_request — per
  # wiki/240 §7, this repo's canonical history is GitLab; the GitHub mirror
  # only syncs `main` and `v*` tags (push-mirror, no MR branches), so a
  # pull_request-triggered run here would only ever see an external
  # contributor's fork PR, and the S/M gate's purpose (catch a perf
  # regression before it reaches `main`) is already served by running on
  # every push to `main` itself.
  #
  # HANDOFF_PERF_SLACK=3.0: shared/noisy-neighbor GitHub-hosted runners are
  # not a quiet dev machine, so every `ms` budget in tests/perf_budgets.toml
  # is scaled 3x before comparison (wiki/240 §7).
  perf-tier1:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    env:
      HANDOFF_PERF_SLACK: "3.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-perf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-perf-

      # One `--ignored` invocation per scale name (not a single filter
      # matching both): libtest's harness filter is a single substring, and
      # `perf_budget_scale_s`/`perf_budget_scale_m` don't share a common
      # prefix with the L/JA/ratio tests reserved for the nightly job.
      - name: perf budget — scale S
        run: cargo test --release --test perf_budget -- --ignored --test-threads=1 --nocapture perf_budget_scale_s

      - name: perf budget — scale M
        run: cargo test --release --test perf_budget -- --ignored --test-threads=1 --nocapture perf_budget_scale_m

  # Nightly perf gate: scales L and JA, plus the PR-9 scale-ratio checks
  # (N: 200->3,000 tasks, D: 20->100 docs). These regenerate a large fixture
  # from scratch and are too slow for every push (wiki/240 §7).
  perf-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    env:
      HANDOFF_PERF_SLACK: "3.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-perf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-perf-

      - name: perf budget — scale L
        run: cargo test --release --test perf_budget -- --ignored --test-threads=1 --nocapture perf_budget_scale_l

      - name: perf budget — scale JA
        run: cargo test --release --test perf_budget -- --ignored --test-threads=1 --nocapture perf_budget_scale_ja

      - name: perf budget — scale-ratio N (200->3,000 tasks)
        run: cargo test --release --test perf_budget -- --ignored --test-threads=1 --nocapture perf_budget_scale_ratio_n

      - name: perf budget — scale-ratio D (20->100 docs)
        run: cargo test --release --test perf_budget -- --ignored --test-threads=1 --nocapture perf_budget_scale_ratio_d

      # Tier 2 (criterion): baseline recorded as a build artifact rather than
      # gated — criterion has no pass/fail budget of its own here, this just
      # keeps a nightly trend visible.
      - name: criterion docs_read baseline
        run: cargo bench --bench docs_read -- --save-baseline nightly

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: criterion-docs_read-baseline
          path: target/criterion/
          retention-days: 30
