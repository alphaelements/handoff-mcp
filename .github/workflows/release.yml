name: Release

# Tag-triggered release: build six prebuilt binaries, verify they install and
# run on every platform, then publish to npm, crates.io, and GitHub Releases.
#
# Publishing runs only for `v*` tag pushes — workflow_dispatch exercises the
# build and verification legs without releasing anything.
#
# npm auth is OIDC trusted publishing, not a token. That requires each package
# to already exist on the registry (npm/cli#8544), which is why the six
# platform packages were bootstrapped once by hand with `0.0.0` placeholders.
# Nothing here can create a new package name.

on:
  push:
    tags: ["v*"]
  # Lets the full build matrix be exercised without cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  # See ci.yml: unbounded parallelism OOMs the runner, and rustc reports the
  # kill as a misleading "can't find crate" error rather than an OOM.
  CARGO_BUILD_JOBS: 2

jobs:
  # One prebuilt binary per published target.
  #
  # Runner pinning is load-bearing, not stylistic:
  #   - ubuntu-22.04 (glibc 2.35), never ubuntu-latest (24.04/glibc 2.39).
  #     glibc symbol versioning is forward-only, so a 2.39 build silently
  #     refuses to start on Debian 12 / RHEL 9.
  #   - macos-15-intel for x86_64: macos-latest is arm64 now.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable && rustup target add ${{ matrix.target }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Build release binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      # Enforces the strip-before-codesign invariant. Cargo's
      # strip = "debuginfo" runs during the build, so by this point the binary
      # must already be stripped — and the codesign step below must come after,
      # because stripping a signed binary invalidates the signature.
      #
      # This is a real check, not a formality: if someone later moves stripping
      # into an explicit post-build step, it would land after codesign and
      # silently ship binaries macOS refuses to run.
      # NEVER pipe into `grep -q` under `set -o pipefail` here. `grep -q` exits
      # at its first match, the upstream command dies of SIGPIPE while still
      # writing, and pipefail turns that into a failed pipeline — so a check
      # reports "not found" precisely when there are MANY matches. That false
      # failure broke both macOS legs on the first two runs (the binary had
      # 1624 matching symbols). Count into a variable instead: `grep -c` reads
      # its input to completion, so nothing gets SIGPIPEd.
      - name: Verify the binary is stripped before signing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/handoff-mcp

          debug_sections="$(readelf -S "$bin" | grep -c '\.debug_info' || true)"
          echo "debug_info sections: $debug_sections"
          if [ "$debug_sections" -ne 0 ]; then
            echo "::error::$bin still has debug_info. strip must happen during"
            echo "::error::the build (Cargo profile), never after codesign."
            exit 1
          fi

          # Symbol names must survive: users of the npm package cannot rebuild
          # with symbols, so RUST_BACKTRACE has to keep resolving frames.
          symbols="$(readelf -s "$bin" | grep -c handoff_mcp || true)"
          echo "handoff_mcp symbols: $symbols"
          if [ "$symbols" -eq 0 ]; then
            echo "::error::$bin lost its symbol names — backtraces would be"
            echo "::error::bare addresses. Expected strip = \"debuginfo\", not \"symbols\"."
            exit 1
          fi

      - name: Verify the binary is stripped before signing (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/handoff-mcp

          # A .dSYM bundle or an __DWARF segment would mean debuginfo survived.
          dwarf="$(dwarfdump --file-type "$bin" 2>/dev/null | grep -ci dwarf || true)"
          echo "DWARF markers: $dwarf"
          if [ "$dwarf" -ne 0 ]; then
            echo "::error::$bin still carries DWARF debuginfo."
            exit 1
          fi

          # `nm -a`, not bare `nm`: on Mach-O the default output lists only
          # external symbols, while Rust's own functions are local ones.
          symbols="$(nm -a "$bin" 2>/dev/null | grep -c handoff_mcp || true)"
          echo "handoff_mcp symbols: $symbols"
          if [ "$symbols" -eq 0 ]; then
            echo "::error::$bin lost its symbol names — backtraces would be bare addresses."
            echo "::error::Expected strip = \"debuginfo\" in [profile.release], not \"symbols\"."
            exit 1
          fi

      # Apple Silicon's kernel SIGKILLs unsigned arm64 binaries ("Killed: 9").
      # This is independent of Gatekeeper and applies to locally built binaries
      # too, so an ad-hoc signature (-) is required. No Apple Developer account
      # is needed. MUST come after any stripping.
      - name: Codesign (macOS arm64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          codesign --force --sign - target/${{ matrix.target }}/release/handoff-mcp
          codesign --verify --verbose target/${{ matrix.target }}/release/handoff-mcp

      - name: Smoke-test the binary
        # Only the natively-runnable legs; every runner here is native, so all
        # six are exercised.
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/handoff-mcp
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          "$bin" --version

      - name: Assemble the npm platform package
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/handoff-mcp
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          node scripts/build-npm-packages.js --target ${{ matrix.target }} --binary "$bin" --outdir npm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ matrix.target }}
          path: npm/
          if-no-files-found: error
          retention-days: 7

  # Prove the wrapper + platform package actually install and run together
  # under npm v12 semantics (install scripts disabled) before anything is
  # published. This is the regression that Phase 2 exists to fix.
  #
  # Runs on EVERY platform, on the same native runner that built the binary —
  # verifying only linux-x64 would leave the two riskiest paths untested: the
  # .exe resolution branch on Windows, and the ad-hoc codesign on macOS arm64
  # (an unsigned arm64 binary is SIGKILLed, so a signing regression shows up
  # only by actually executing it on Apple Silicon).
  verify-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            pkg: handoff-mcp-server-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            pkg: handoff-mcp-server-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            pkg: handoff-mcp-server-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            pkg: handoff-mcp-server-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            pkg: handoff-mcp-server-win32-x64
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            pkg: handoff-mcp-server-win32-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ matrix.target }}
          path: npm

      # Artifacts round-trip through a Zip, which does not carry the Unix
      # executable bit (actions/upload-artifact#38), so the binary arrives
      # mode 0644 and the wrapper fails with EACCES. Restore it before packing.
      #
      # This is not merely a CI nuisance: any publish job that consumes these
      # artifacts would otherwise ship a tarball whose binary cannot execute.
      # The chmod belongs on every path from artifact to `npm pack`.
      - name: Restore the executable bit lost by the artifact Zip
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="npm/${{ matrix.pkg }}/bin/handoff-mcp"
          chmod +x "$bin"
          ls -l "$bin"

      # One install, reused by the checks below: packing twice would double the
      # runtime without testing anything new.
      - name: Install from tarballs with install scripts disabled
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          plat="$(cd npm/${{ matrix.pkg }} && npm pack --silent --pack-destination "$work")"
          wrap="$(npm pack --silent --pack-destination "$work")"
          cd "$work"
          npm init -y >/dev/null
          # --ignore-scripts reproduces npm v12's default (allowScripts off).
          npm install --ignore-scripts --no-audit --no-fund "$work/$plat" "$work/$wrap"
          echo "WORK=$work" >> "$GITHUB_ENV"

      # On macOS arm64 this is the codesign check: an improperly signed binary
      # dies with "Killed: 9" here rather than printing a version.
      - name: The installed CLI must run
        shell: bash
        run: cd "$WORK" && ./node_modules/.bin/handoff-mcp --version

      - name: The CLI must speak MCP over stdio through the wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          req='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          out="$(printf '%s\n' "$req" | ./node_modules/.bin/handoff-mcp)"
          echo "$out" | head -c 200
          # `case`, not `| grep -q`: grep -q exits early, the writer upstream
          # dies of SIGPIPE, and pipefail turns that into a failed pipeline.
          case "$out" in
            *'"serverInfo"'*) ;;
            *) echo "no MCP handshake"; exit 1 ;;
          esac

      - name: A missing platform package must fail loudly, not silently
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          wrap="$(npm pack --silent --pack-destination "$work")"
          cd "$work"
          npm init -y >/dev/null
          npm install --ignore-scripts --omit=optional --no-audit --no-fund "$work/$wrap"
          if ./node_modules/.bin/handoff-mcp --version >/dev/null 2>&1; then
            echo "expected failure without the platform package"; exit 1
          fi
          # Capture instead of piping: `tee /dev/stderr` does not exist under
          # Git Bash on Windows runners, and `grep -q` would SIGPIPE the writer
          # under pipefail. `|| true` because the command is expected to fail.
          msg="$(./node_modules/.bin/handoff-mcp --version 2>&1 || true)"
          echo "$msg"
          # Assert on the package name, not on the shared remediation text:
          # every resolution failure mentions --omit=optional, so matching that
          # would pass even if the message named the wrong platform.
          case "$msg" in
            *'${{ matrix.pkg }}'*) ;;
            *) echo "error did not name the missing platform package"; exit 1 ;;
          esac

  # ---------------------------------------------------------------------------
  # Publishing. Tag pushes only — a workflow_dispatch run stops after verifying.
  # ---------------------------------------------------------------------------

  # The tag must match the version being released, or the wrapper would ship
  # pinned to platform packages that were never published at that version.
  version-check:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-install
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag, package.json, and Cargo.toml must agree
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          crate="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag package.json=$pkg Cargo.toml=$crate"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$crate" ]; then
            echo "::error::version mismatch — tag $tag, package.json $pkg, Cargo.toml $crate"
            exit 1
          fi

  # Platform packages FIRST. npm has no atomic multi-package publish, so the
  # wrapper must land last: while it is on the registry and its pinned platform
  # packages are not, every install of it fails to resolve a binary.
  publish-platform-packages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: version-check
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    strategy:
      # Never parallel: a half-published set is the failure mode this whole
      # ordering exists to avoid, and fail-fast can't unpublish what already
      # went out. Serial keeps the blast radius to one package.
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            pkg: handoff-mcp-server-linux-x64
          - target: aarch64-unknown-linux-gnu
            pkg: handoff-mcp-server-linux-arm64
          - target: x86_64-apple-darwin
            pkg: handoff-mcp-server-darwin-x64
          - target: aarch64-apple-darwin
            pkg: handoff-mcp-server-darwin-arm64
          - target: x86_64-pc-windows-msvc
            pkg: handoff-mcp-server-win32-x64
          - target: aarch64-pc-windows-msvc
            pkg: handoff-mcp-server-win32-arm64
    steps:
      # registry-url is required — it is what points npm at the registry — but
      # it also writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # into .npmrc. With no NODE_AUTH_TOKEN set, npm commits to token auth
      # against an empty token and never negotiates OIDC
      # (actions/setup-node#1551). Both halves of that have now been observed
      # here: keeping the line gave `E404 PUT`, dropping registry-url entirely
      # gave `ENEEDAUTH`. The fix is to keep registry-url and strip the token
      # line afterwards. setup-node's `auth-token-line: false` input would do
      # this natively but does not exist in the pinned v7.0.0.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Strip the _authToken line that blocks OIDC
        shell: bash
        run: |
          set -euo pipefail
          rc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$rc" ]; then
            echo "--- before (redacted) ---"; sed 's/=.*/=<redacted>/' "$rc"
            sed -i.bak '/_authToken/d' "$rc"
            rm -f "$rc.bak"
            echo "--- after (redacted) ---"; sed 's/=.*/=<redacted>/' "$rc"
          else
            echo "no .npmrc at $rc"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ matrix.target }}
          path: npm

      # Same exec-bit loss as in verify-install. Here it decides whether the
      # PUBLISHED tarball contains a runnable binary, so it is load-bearing.
      - name: Restore the executable bit lost by the artifact round-trip
        if: matrix.target != 'x86_64-pc-windows-msvc' && matrix.target != 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "npm/${{ matrix.pkg }}/bin/handoff-mcp"
          ls -l "npm/${{ matrix.pkg }}/bin/handoff-mcp"

      # npm >= 11.5.1 is required for trusted publishing; the runner's bundled
      # npm may predate it.
      - name: Ensure npm supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          npm install -g npm@latest
          npm --version

      # A misconfigured OIDC trust surfaces as `E404 PUT` on a package that
      # exists, which reads like "package not found" and sends you the wrong
      # way. Print what npm is about to authenticate with, so the next failure
      # is diagnosable from the log.
      - name: Show the auth context npm will use
        shell: bash
        run: |
          echo "npm: $(npm --version)"
          echo "OIDC token available: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO — id-token: write is missing}"
          echo "--- npm config (redacted) ---"
          npm config list 2>&1 | grep -v '_auth\|token' || true

      - name: Publish ${{ matrix.pkg }}
        shell: bash
        working-directory: npm/${{ matrix.pkg }}
        run: |
          set -euo pipefail
          # Idempotent: re-running a partially failed release must not abort on
          # the packages that already went out.
          version="$(node -p "require('./package.json').version")"
          if npm view "${{ matrix.pkg }}@$version" version >/dev/null 2>&1; then
            echo "${{ matrix.pkg }}@$version already published — skipping"
            exit 0
          fi
          # No --provenance flag: OIDC attaches provenance automatically.
          npm publish --access public

  # Every platform package must be resolvable BEFORE the wrapper is published,
  # otherwise installs break for the window between the two.
  verify-platform-packages-live:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-platform-packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: All six platform packages must be live at this version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          missing=0
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            pkg="handoff-mcp-server-$p"
            # The registry is read-through-cache; a just-published version can
            # lag. Retry before declaring it missing.
            found=""
            for attempt in 1 2 3 4 5 6; do
              if npm view "$pkg@$version" version >/dev/null 2>&1; then found=yes; break; fi
              sleep 10
            done
            if [ -n "$found" ]; then
              echo "ok: $pkg@$version"
            else
              echo "::error::$pkg@$version is not on the registry"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

  # The wrapper goes last. Publishing it earlier would make `npm install
  # handoff-mcp-server` resolve a wrapper whose pinned binaries do not exist.
  publish-wrapper:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-platform-packages-live
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # registry-url is required — it is what points npm at the registry — but
      # it also writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # into .npmrc. With no NODE_AUTH_TOKEN set, npm commits to token auth
      # against an empty token and never negotiates OIDC
      # (actions/setup-node#1551). Both halves of that have now been observed
      # here: keeping the line gave `E404 PUT`, dropping registry-url entirely
      # gave `ENEEDAUTH`. The fix is to keep registry-url and strip the token
      # line afterwards. setup-node's `auth-token-line: false` input would do
      # this natively but does not exist in the pinned v7.0.0.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Strip the _authToken line that blocks OIDC
        shell: bash
        run: |
          set -euo pipefail
          rc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$rc" ]; then
            echo "--- before (redacted) ---"; sed 's/=.*/=<redacted>/' "$rc"
            sed -i.bak '/_authToken/d' "$rc"
            rm -f "$rc.bak"
            echo "--- after (redacted) ---"; sed 's/=.*/=<redacted>/' "$rc"
          else
            echo "no .npmrc at $rc"
          fi

      - name: Ensure npm supports trusted publishing
        shell: bash
        run: npm install -g npm@latest && npm --version

      - name: Publish handoff-mcp-server
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "handoff-mcp-server@$version" version >/dev/null 2>&1; then
            echo "handoff-mcp-server@$version already published — skipping"
            exit 0
          fi
          npm publish --access public

  publish-crate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: version-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if curl -sf "https://crates.io/api/v1/crates/handoff-mcp/$version" \
               -H "User-Agent: handoff-mcp-release" >/dev/null 2>&1; then
            echo "handoff-mcp@$version already on crates.io — skipping"
            exit 0
          fi
          cargo publish

  # Runs last so the release notes never point at artifacts that failed to
  # publish. `gh release create` is prebuilt on the runner — no third-party
  # action, one less supply-chain dependency (see the spec's §5.2 policy).
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-wrapper, publish-crate]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tarballs="$(mktemp -d)"
          for d in artifacts/npm-package-*/*/; do
            name="$(basename "$d")"
            bin="$d/bin/handoff-mcp"
            [ -f "$bin" ] && chmod +x "$bin"
            tar -czf "$tarballs/$name-$version.tar.gz" -C "$(dirname "$d")" "$name"
          done
          ls -la "$tarballs"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Prebuilt binaries for Linux, macOS, and Windows (x64 and arm64). Install with \`npm install -g handoff-mcp-server\` — no Rust toolchain required. See CHANGELOG.md for changes." \
            "$tarballs"/*.tar.gz
