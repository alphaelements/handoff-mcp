# Lefthook — handoff-mcp pre-commit hooks
#
# Pre-commit is deliberately fast (target: under 60s for a typical 1-3 file
# change): format, clippy, and only the tests related to the staged files.
# The full test suite, the bundled-typst clippy, the Windows cfg check and the
# security scans run in CI on merge requests (.gitlab-ci.yml); there is no
# pre-push hook.
#
# All cargo commands are routed through scripts/cargo-env.sh so the hooks work
# across heterogeneous dev environments (local macOS, a synced Mac, Docker).
# The script falls back to a writable $HOME/.cargo when CARGO_HOME points at a
# location the current user cannot write to (e.g. root-owned /usr/local/cargo
# in a container), and serializes cargo's build jobs (CARGO_BUILD_JOBS=1) when
# the working tree sits on a Docker Desktop bind mount, where concurrent rustc
# processes can race on a freshly-written .rlib/.rmeta.

pre-commit:
  parallel: false
  commands:
    fmt-check:
      glob: "**/*.rs"
      run: . scripts/cargo-env.sh && cargo fmt --all -- --check
      fail_text: "rustfmt failed. Run 'cargo fmt --all' to fix."

    clippy:
      glob: "**/*.rs"
      run: . scripts/cargo-env.sh && cargo clippy --all-targets -- -D warnings
      fail_text: "clippy warnings found. Fix all warnings before committing."

    # Runs only the tests related to the staged .rs files: the file stems are
    # used as libtest name filters (substring match) against the lib unit tests
    # and the single `integration` test binary (tests/integration/<module>.rs
    # becomes the `<module>::` test-name prefix). A filter that matches nothing
    # runs zero tests and exits 0, so unrelated edits do not fail the hook.
    # The full suite runs in CI.
    related-test:
      glob: "**/*.rs"
      run: |
        . scripts/cargo-env.sh
        FILTERS=$(git diff --cached --name-only --diff-filter=d -- '*.rs' \
          | sed 's|.*/||; s|\.rs$||' | grep -v -x -e mod -e main -e lib | sort -u)
        if [ -z "$FILTERS" ]; then
          echo "No related test modules for the staged .rs files, skipping."
          exit 0
        fi
        echo "Related test filters: $(echo $FILTERS | tr '\n' ' ')"
        # Word splitting is intended: each stem is a separate libtest filter.
        # shellcheck disable=SC2086
        env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_QUARANTINE_PATH \
          cargo test --lib --test integration -- $FILTERS
      fail_text: "Related tests failed. The full suite runs in CI on merge requests."

    no-main-commit:
      run: |
        BRANCH=$(git branch --show-current)
        if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
          echo "ERROR: Direct commits to $BRANCH are prohibited."
          echo "Create a feature branch first."
          exit 1
        fi
      fail_text: "Direct commits to main/master are prohibited."

    plugin-version-sync:
      glob: "{package.json,plugin/.claude-plugin/plugin.json,plugin-hooks/.claude-plugin/plugin.json,plugin-task-loop/.claude-plugin/plugin.json,plugins/handoff-task-loop-codex/.codex-plugin/plugin.json,.claude-plugin/marketplace.json}"
      run: ./scripts/sync-plugin-version.sh --check
      fail_text: "Plugin/marketplace manifest versions are out of sync with package.json. Run './scripts/sync-plugin-version.sh' to fix."

    plugin-skills-sync:
      glob: "{skills/**/*.md,skills/**/*.yaml,plugin/skills/**/*.md,plugin/skills/**/*.yaml}"
      run: ./scripts/sync-plugin-skills.sh --check
      fail_text: "plugin/skills/ is out of sync with skills/. Run './scripts/sync-plugin-skills.sh' and commit the result — the marketplace serves plugin/skills/, so an unsynced skill never reaches users."

    workflow-inline-sync:
      glob: "plugin-task-loop/workflows/**/*.js"
      run: ./scripts/sync-workflow-inline.sh --check
      fail_text: "session-execute.js is out of sync with lib/verdict-logic.js. Run './scripts/sync-workflow-inline.sh' to regenerate."

    workflow-js-test:
      glob: "plugin-task-loop/workflows/**/*.js"
      run: node --test "plugin-task-loop/workflows/lib/*.test.js"
      fail_text: "Workflow verdict-logic tests failed."

    npm-distribution-test:
      # release.yml is in the glob because one of these tests asserts its build
      # matrix matches the packaging tables — editing the matrix must run it.
      glob: "{bin/*.js,scripts/build-npm-packages.js,package.json,.github/workflows/release.yml}"
      run: node --test "bin/*.test.js"
      fail_text: "npm distribution tests failed. The wrapper's platform table, the release build matrix, and package.json optionalDependencies must agree — a mismatch ships an install that resolves no binary."
